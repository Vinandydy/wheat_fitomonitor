[project]
name = "wheat-fitomonitor"
version = "0.1.0"
description = "Исследование доверенности EfficientNet-B5: классификация болезней пшеницы (курс по безопасному ИИ)"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.14",
    "torchvision>=0.29",
    "torchinfo",
    "tqdm",
    "matplotlib",
    "pillow",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "seaborn",
    "cleanlab",
    "torchattacks",
    "opencv-python-headless",
    "imagehash",
    "piq",
    "python-docx>=1.2.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
